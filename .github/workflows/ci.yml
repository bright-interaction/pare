# CI for the public fair-code repo (github.com/bright-interaction/pare).
#
# THIS FILE IS DELIBERATELY THIN. Every actual check lives in scripts/ci.sh, which you
# can run yourself:
#
#   bash scripts/ci.sh
#
# Two reasons for the split. A contributor can reproduce CI locally instead of
# discovering a failure after pushing. And this repository is a filtered mirror
# published by a job that authenticates with a repository deploy key, which GitHub does
# not permit to create or update anything under .github/workflows/. Keeping the steps
# out of this file means a change to a check no longer breaks the publish at its final
# push, after every gate has already passed.
#
# So: edit scripts/ci.sh freely. Editing THIS file is a rare, deliberate act (an action
# version bump, a trigger change) and needs a push from a credential holding the
# `workflow` scope.
#
# THE POSTGRES SERVICE IS NOT OPTIONAL HERE. Without PARE_TEST_DATABASE_URL, 32 of
# pare's 72 test files skip themselves (all of internal/store and internal/mcp) while
# `go test` still prints ok for those packages. scripts/ci.sh is honest about that and
# reports the suite as DID NOT RUN rather than passed, but "honest about covering less"
# is not the same as covering it. Giving CI a real database is what makes the storage
# and MCP layers actually tested on a pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pare
          POSTGRES_PASSWORD: pare
          POSTGRES_DB: pare
        ports:
          - 5432:5432
        # Without this the job races the server's first-boot initdb and the
        # first connection fails on a database that is about to exist.
        options: >-
          --health-cmd "pg_isready -U pare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # internal/testdb derives a separate pare_<suffix> database per test
      # package from this DSN, so the suites do not share state.
      PARE_TEST_DATABASE_URL: postgres://pare:pare@localhost:5432/pare?sslmode=disable

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the secret scan reads full history, not just the tip

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: All checks (build, vet, test, gofmt, licenses, secrets, vulnerabilities)
        run: bash scripts/ci.sh
